<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>B站之眼 · 设置中心</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f8cff'/%3E%3Cpath d='M8 14c3-4 6-6 11-6 3 0 5 .8 6 2' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='13' cy='19' r='2.3' fill='white'/%3E%3Ccircle cx='21' cy='19' r='2.3' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="34" height="34">
              <defs>
                <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#4f8cff" />
                  <stop offset="1" stop-color="#8b5cf6" />
                </linearGradient>
              </defs>
              <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#brand-gradient)" />
              <path d="M7 13.5c3-4 6.5-5.5 11.5-5.5 3 0 5 .7 6.5 2" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" />
              <circle cx="12.5" cy="18.5" r="2.3" fill="#fff" />
              <circle cx="21" cy="18.5" r="2.3" fill="#fff" />
              <path d="M12 24c2.3 1.4 5 1.4 7.5 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" />
            </svg>
          </span>
          <span class="brand-text"><strong>B站之眼</strong><small>观看与笔记管理中心</small></span>
        </div>
        <nav class="nav" id="nav" aria-label="功能导航"></nav>
        <div class="sidebar-foot">
          <div class="version-line"><span class="dot" id="side-dot"></span><span id="side-version">v—</span></div>
          <div class="side-path" id="side-path">—</div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="title-block">
            <h1 id="page-title">概览</h1>
            <p id="page-desc">插件运行状态、登录情况与最近观看。</p>
          </div>
          <div class="top-actions">
            <span class="pill" id="login-pill">读取中…</span>
            <button class="btn ghost" id="btn-reload" type="button">刷新</button>
            <button class="btn primary" id="btn-save" type="button" disabled>保存更改</button>
          </div>
        </header>

        <div class="alert" id="alert" role="alert" hidden></div>

        <div class="views" id="views">
          <section class="view active" data-view="overview" id="view-overview"></section>
          <section class="view" data-view="videos" id="view-videos"></section>
          <section class="view" data-view="login" id="view-login"></section>
          <div id="settings-views"></div>
          <section class="view" data-view="transcript" id="view-transcript"></section>
          <section class="view" data-view="cache" id="view-cache"></section>
          <section class="view" data-view="diagnostics" id="view-diagnostics"></section>
          <section class="view" data-view="detail" id="view-detail"></section>
        </div>

        <footer class="savebar" id="savebar" hidden>
          <span class="dirty-note" id="dirty-note">有未保存的更改</span>
          <button class="btn ghost" id="btn-discard" type="button">放弃</button>
          <button class="btn primary" id="btn-save-2" type="button">保存更改</button>
        </footer>
      </main>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <div class="modal" id="modal" hidden>
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h3 id="modal-title">确认操作</h3>
        <p id="modal-body"></p>
        <div class="modal-actions">
          <button class="btn ghost" id="modal-cancel" type="button" data-close="1">取消</button>
          <button class="btn danger" id="modal-ok" type="button">确认</button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
