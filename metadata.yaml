name: astrbot_plugin_bilibili_eyes
display_name: B站之眼
short_desc: 子代理看 B 站视频，把客观笔记交给主模型理解后回复
desc: >-
  让主模型通过子代理“看” B 站内容：子代理在隔离上下文里读取字幕/简介/评论、
  抽取 12 帧关键画面并整理成客观笔记，主模型拿笔记后用自己的判断和语气回复。
  支持视频信息、播放数据、字幕、评论、UP 主页、热点选帧、卡片转链、追问、
  按时间点截图、等待提示与笔记缓存。
version: 0.5.7
author: AcceleratorYue
repo: https://github.com/AcceleratorYue/astrbot_plugin_bilibili_eyes
social_link: https://github.com/AcceleratorYue
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
tags:
  - bilibili
  - 视频理解
  - 子代理
  - 多模态
