name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "astrbot==4.29.3"
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Static checks
        run: |
          python -m py_compile main.py eyes_*.py plugin_api/*.py tests/test_offline.py
          ruff check --select F821,F823,F841 --output-format concise .
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("_conf_schema.json").read_text(encoding="utf-8"))
          print("schema JSON: ok")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: UI JavaScript syntax
        run: |
          node --check pages/pluginCenter/app.js

      - name: Offline regression tests
        run: python tests/test_offline.py
